# P-Core Orchestra — project identity (dogfood)
project:
  name: pcore-orchestra
  slug: pcore-orchestra
  display_name: P-Core Orchestra
  type: devops
  category: dev-tools
  owner: maintainer
  description: Global orchestra harness for Cursor, OpenCode CLI, and Qoder CLI

version:
  current: 3.9.0
  channel: stable
  build_number: 1

lifecycle:
  stage: production
  status: active
  started: 2026-01-01
  updated: 2026-10-31

repository:
  url: https://github.com/P-Core-System/pcore-orchestra
  branch: main
  provider: github
  visibility: public

stack:
  languages:
    - javascript
  frameworks: []
  package_manager: npm
  runtime: node

ai:
  assistant: cursor
  context_dir: context/
  entry_point: AGENTS.md

orchestra:
